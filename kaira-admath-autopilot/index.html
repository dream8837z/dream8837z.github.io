<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>KAIRA — Quiet Luxury Ritual & Deep Focus OS</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --bg-canvas: #0E0D0C;
      --bg-elevated: #171513;
      --bg-card: #1C1A17;
      --bg-glass: rgba(23, 21, 19, 0.78);
      --text-primary: #F4EFE6;
      --text-secondary: #A89F94;
      --text-muted: #6E665E;
      --gold: #D4AF6A;
      --gold-soft: rgba(212, 175, 106, 0.14);
      --gold-border: rgba(212, 175, 106, 0.42);
      --sage: #8EA494;
      --sage-soft: rgba(142, 164, 148, 0.15);
      --border: rgba(244, 239, 230, 0.08);
      --shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
      --ease-editorial: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --font-serif: 'Instrument Serif', 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Pretendard Variable', 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    [data-theme="light"] {
      --bg-canvas: #F6F2EB;
      --bg-elevated: #FFFFFF;
      --bg-card: #FBF9F5;
      --bg-glass: rgba(255, 255, 255, 0.84);
      --text-primary: #1A1816;
      --text-secondary: #635B53;
      --text-muted: #968D84;
      --gold: #B58E47;
      --gold-soft: rgba(181, 142, 71, 0.12);
      --gold-border: rgba(181, 142, 71, 0.45);
      --sage: #5F7A67;
      --sage-soft: rgba(95, 122, 103, 0.13);
      --border: rgba(26, 24, 22, 0.09);
      --shadow: 0 24px 64px rgba(26, 24, 22, 0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: var(--font-sans);
      background: var(--bg-canvas);
      color: var(--text-primary);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      transition: background 0.45s var(--ease-editorial), color 0.35s ease;
      overflow-x: hidden;
      position: relative;
    }

    /* Subtle Editorial Film Grain Overlay (0.035 opacity) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.032;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* Ambient Luxury Glow */
    .ambient-orb {
      position: fixed;
      top: -180px;
      left: 50%;
      transform: translateX(-50%);
      width: 640px;
      height: 420px;
      background: radial-gradient(ellipse at center, rgba(212, 175, 106, 0.14), transparent 70%);
      pointer-events: none;
      z-index: 0;
      transition: background 0.6s ease;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg-canvas);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    /* Top Minimal Bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px 12px;
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--bg-glass);
      backdrop-filter: blur(20px) saturate(140%);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .brand-mark {
      font-family: var(--font-serif);
      font-size: 24px;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }
    .brand-tag {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pill-btn {
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.25s var(--ease-editorial);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .pill-btn:hover {
      border-color: var(--gold-border);
      color: var(--text-primary);
    }
    .pill-btn.gold {
      background: var(--gold-soft);
      border-color: var(--gold-border);
      color: var(--gold);
    }

    /* Progress Bar */
    .progress-track {
      height: 2px;
      background: var(--border);
      width: 100%;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), #F0D59C);
      width: 16.6%;
      transition: width 0.55s var(--ease-editorial);
    }

    .stage {
      flex: 1;
      padding: 28px 24px 110px;
      display: flex;
      flex-direction: column;
      animation: fadeSlide 0.5s var(--ease-editorial);
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }
    .hero-title {
      font-family: var(--font-serif);
      font-size: 38px;
      line-height: 1.12;
      letter-spacing: -0.025em;
      font-weight: 400;
      margin-bottom: 10px;
    }
    .hero-title em {
      font-style: italic;
      color: var(--gold);
    }
    .hero-sub {
      font-size: 14px;
      line-height: 1.58;
      color: var(--text-secondary);
      margin-bottom: 26px;
    }

    /* 2x2 Visual Cards */
    .visual-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .v-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: transform 0.3s var(--ease-spring), border-color 0.25s ease, background 0.25s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .v-card:hover { transform: translateY(-2px); border-color: var(--gold-border); }
    .v-card:active { transform: scale(0.97); }
    .v-card.selected {
      border-color: var(--gold);
      background: var(--gold-soft);
      box-shadow: 0 0 0 1px var(--gold), 0 12px 28px rgba(212, 175, 106, 0.12);
    }
    .v-art {
      height: 112px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, rgba(212, 175, 106, 0.12), rgba(255,255,255,0.02));
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
    }
    .v-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s var(--ease-editorial);
    }
    .v-card:hover .v-art img {
      transform: scale(1.06);
    }
    .v-card-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.015em;
    }
    .v-card-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: -8px;
    }

    /* Chronotype Sky Card */
    .sky-card {
      border-radius: 24px;
      padding: 28px 22px;
      border: 1px solid var(--border);
      text-align: center;
      transition: background 0.6s ease;
      margin-bottom: 22px;
    }
    .sky-time {
      font-family: var(--font-mono);
      font-size: 52px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
      color: #FFFFFF;
      text-shadow: 0 4px 20px rgba(0,0,0,0.35);
    }
    .sky-label {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.88);
    }
    input[type="range"].luxury-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: var(--border);
      outline: none;
      margin: 18px 0 8px;
    }
    input[type="range"].luxury-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--gold);
      border: 3px solid var(--bg-canvas);
      box-shadow: 0 4px 16px rgba(212,175,106,0.45);
      cursor: pointer;
    }

    /* Intensity Stack */
    .stack-list { display: flex; flex-direction: column; gap: 12px; }
    .stack-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.28s var(--ease-spring);
    }
    .stack-card.selected {
      border-color: var(--gold);
      background: var(--gold-soft);
      box-shadow: 0 0 0 1px var(--gold);
    }
    .badge-rec {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--gold);
      color: #141210;
    }

    /* Synthesis Chart & Loading */
    .check-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      margin-bottom: 10px;
      font-size: 14px;
      transition: all 0.35s ease;
    }
    .check-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: transparent;
      transition: all 0.35s var(--ease-spring);
    }
    .check-row.done { border-color: var(--gold-border); }
    .check-row.done .check-dot {
      background: var(--gold);
      border-color: var(--gold);
      color: #141210;
    }
    .curve-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 20px;
      margin-top: 14px;
    }
    .curve-path {
      stroke-dasharray: 420;
      stroke-dashoffset: 420;
      animation: drawLine 1.4s var(--ease-editorial) forwards;
    }
    @keyframes drawLine { to { stroke-dashoffset: 0; } }

    /* Paywall */
    .trial-toggle-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .switch {
      width: 46px;
      height: 26px;
      border-radius: 999px;
      background: var(--border);
      position: relative;
      cursor: pointer;
      transition: background 0.25s ease;
    }
    .switch.on { background: var(--gold); }
    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #FFFFFF;
      transition: transform 0.28s var(--ease-spring);
    }
    .switch.on::after { transform: translateX(20px); }

    .timeline-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 12.5px;
    }
    .tl-item { display: flex; align-items: center; gap: 10px; }
    .tl-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }

    .plan-card {
      border: 1.5px solid var(--border);
      background: var(--bg-elevated);
      border-radius: 18px;
      padding: 16px 18px;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      transition: all 0.25s ease;
    }
    .plan-card.selected {
      border-color: var(--gold);
      background: var(--gold-soft);
      box-shadow: 0 10px 28px rgba(212, 175, 106, 0.14);
    }
    .plan-badge {
      position: absolute;
      top: -10px;
      right: 14px;
      background: var(--gold);
      color: #141210;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 3px 9px;
      border-radius: 999px;
    }

    /* Sticky Bottom CTA */
    .bottom-cta-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 460px;
      padding: 14px 22px calc(16px + env(safe-area-inset-bottom));
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      z-index: 40;
    }
    .primary-btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 16px 20px;
      background: linear-gradient(135deg, var(--gold), #E6C88B);
      color: #141210;
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s var(--ease-spring), box-shadow 0.25s ease;
      box-shadow: 0 10px 30px rgba(212, 175, 106, 0.28);
    }
    .primary-btn:active { transform: scale(0.98); }
    .primary-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

    /* Main Ritual OS App Views */
    .os-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 6px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 999px;
      margin-bottom: 20px;
    }
    .os-tab {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      padding: 9px 10px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .os-tab.active {
      background: var(--gold);
      color: #141210;
    }

    .ritual-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-radius: 18px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.28s var(--ease-spring);
    }
    .ritual-item.done {
      border-color: rgba(142, 164, 148, 0.45);
      background: var(--sage-soft);
    }
    .ritual-check {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.28s var(--ease-spring);
      flex-shrink: 0;
    }
    .ritual-item.done .ritual-check {
      background: var(--sage);
      border-color: var(--sage);
      color: #0E0D0C;
    }

    /* 88-Day Heatmap */
    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      gap: 6px;
      margin-top: 14px;
    }
    .hm-dot {
      aspect-ratio: 1;
      border-radius: 5px;
      background: var(--border);
      transition: transform 0.2s ease;
    }
    .hm-dot.l1 { background: rgba(212, 175, 106, 0.28); }
    .hm-dot.l2 { background: rgba(212, 175, 106, 0.58); }
    .hm-dot.l3 { background: var(--gold); box-shadow: 0 0 8px rgba(212, 175, 106, 0.35); }

    /* Deep Focus Timer */
    .timer-ring-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
    }
    .breathing-aura {
      width: 230px;
      height: 230px;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .breathing-aura.running::before {
      content: "";
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 1px solid var(--gold-border);
      animation: breathe 8s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(0.95); opacity: 0.25; }
      50% { transform: scale(1.07); opacity: 0.8; }
    }
    .timer-digits {
      font-family: var(--font-mono);
      font-size: 46px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }

    .coach-card {
      background: linear-gradient(145deg, var(--gold-soft), var(--bg-elevated));
      border: 1px solid var(--gold-border);
      border-radius: 20px;
      padding: 18px;
      margin-top: 16px;
    }

    /* Checkout Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(8px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal-sheet {
      width: 100%;
      max-width: 460px;
      background: var(--bg-elevated);
      border-top: 1px solid var(--gold-border);
      border-radius: 26px 26px 0 0;
      padding: 24px 22px 32px;
      animation: fadeSlide 0.35s var(--ease-editorial);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="ambient-orb" id="ambientOrb"></div>

  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">KAIRA</span>
        <span class="brand-tag">RITUAL OS</span>
      </div>
      <div class="topbar-controls">
        <button class="pill-btn" id="langBtn" onclick="toggleLang()">EN</button>
        <button class="pill-btn" id="themeBtn" onclick="toggleTheme()">☀</button>
        <a class="pill-btn gold" href="./studio.html" title="Open Founder Ad-Math Command Studio">AD-MATH ↗</a>
      </div>
    </header>
    <div class="progress-track" id="progressTrack">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <main class="stage" id="stage"></main>

    <div class="bottom-cta-bar" id="ctaBar">
      <button class="primary-btn" id="mainCta" onclick="handleNext()">계속하기</button>
    </div>
  </div>

  <!-- Web-to-App 3.5% Fee Instant Checkout Simulation Sheet -->
  <div class="modal-backdrop" id="checkoutModal">
    <div class="modal-sheet">
      <div class="eyebrow" id="chkEyebrow">WEB-TO-APP DIRECT CHECKOUT · 3.5% FEE</div>
      <h3 style="font-family: var(--font-serif); font-size: 28px; font-weight: 400; margin-bottom: 6px;" id="chkTitle">KAIRA Annual Privilege</h3>
      <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 18px;" id="chkDesc">App Store 15% 수수료 없이 웹에서 즉시 활성화 · 3일 무료 후 자동 전환</p>
      <div style="display:flex; justify-content:space-between; padding:12px 14px; border-radius:14px; background:var(--bg-card); border:1px solid var(--border); margin-bottom:14px; font-family:var(--font-mono); font-size:13px;">
        <span id="chkTodayLabel">오늘 결제 금액</span>
        <strong style="color:var(--gold);" id="chkTodayAmt">₩0 (3일 무료)</strong>
      </div>
      <button class="primary-btn" onclick="completeCheckout()" id="chkConfirmBtn">원탭으로 88일 리추얼 시작하기</button>
      <button class="pill-btn" style="width:100%; justify-content:center; margin-top:10px; padding:11px;" onclick="closeCheckout()" id="chkCancelBtn">돌아가기</button>
    </div>
  </div>

  <script>
    const I18N = {
      ko: {
        step1_eye: 'STEP 01 · CORE IDENTITY',
        step1_h: '어떤 하루를 <em>설계</em>할까요?',
        step1_s: '복잡한 체크리스트 대신, 당신의 정체성을 바꿀 단 하나의 방향을 고르세요.',
        goals: [

      } else {
        renderOS(stage, L);
      }
    }

    function renderOS(stage, L) {
      if (!state.rituals || state.rituals.length === 0) buildPersonalizedRituals();
      const doneCount = state.rituals.filter(r => r.done).length;
      const pct = Math.round((doneCount / state.rituals.length) * 100);

      let bodyHtml = '';
      if (state.activeTab === 0) {
        bodyHtml = `
          <div style="display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-radius:22px; background:var(--bg-elevated); border:1px solid var(--border); margin-bottom:16px;">
            <div>
              <div class="eyebrow" style="margin-bottom:4px;">DAY ${state.streak} / 88 · ${state.subscribed ? 'ANNUAL PRO' : 'FREE MODE'}</div>
              <div style="font-family:var(--font-serif); font-size:26px;">${state.lang === 'ko' ? '오늘의 고요한 리추얼' : "Today's Quiet Rituals"}</div>
            </div>
            <div style="font-family:var(--font-mono); font-size:24px; font-weight:700; color:var(--gold);">${pct}%</div>
          </div>
          ${state.rituals.map(r => `
            <div class="ritual-item ${r.done ? 'done' : ''}" onclick="toggleRitual(${r.id})">
              <div>
                <div style="font-size:10px; font-weight:700; letter-spacing:0.12em; color:var(--gold); margin-bottom:3px;">${r.tag}</div>
                <div style="font-size:14.5px; font-weight:500; ${r.done ? 'text-decoration:line-through; opacity:0.75;' : ''}">${r.title}</div>
              </div>
              <div class="ritual-check">${r.done ? '✓' : ''}</div>
            </div>
          `).join('')}
          <div style="display:flex; gap:8px; margin-top:10px;">
            <input id="newRitualInput" placeholder="${state.lang === 'ko' ? '새 리추얼 추가...' : 'Add new ritual...'}" style="flex:1; padding:12px 14px; border-radius:14px; border:1px solid var(--border); background:var(--bg-elevated); color:var(--text-primary); font-family:var(--font-sans); font-size:13.5px;" />
            <button class="pill-btn gold" style="padding:0 16px; border-radius:14px;" onclick="addRitual()">+</button>
          </div>
          <div class="coach-card">
            <div class="eyebrow" style="margin-bottom:6px;">AI RITUAL COACH INSIGHT</div>
            <p style="font-size:13px; line-height:1.58; color:var(--text-primary);">
              ${state.lang === 'ko'
                ? `현재 ${state.streak}일 연속 스트릭 유지 중입니다. ${formatWake(state.wakeMinutes)} 기상 직후 첫 15분간 휴대폰을 비행기 모드로 유지하면 오늘 완료율이 94%까지 올라갑니다.`
                : `You are on a ${state.streak}-day streak. Keeping airplane mode on for 15 minutes after ${formatWake(state.wakeMinutes)} boosts your daily completion odds to 94%.`}
            </p>
          </div>`;
      } else if (state.activeTab === 1) {
        const mm = String(Math.floor(timerSec / 60)).padStart(2, '0');
        const ss = String(timerSec % 60).padStart(2, '0');
        bodyHtml = `
          <div class="timer-ring-wrap">
            <div class="eyebrow">DEEP FOCUS · 4s BREATHING SYNC</div>
            <div class="breathing-aura ${timerRunning ? 'running' : ''}" style="border:2px solid var(--gold-border); background:var(--bg-elevated); margin:16px 0 22px;">
              <div style="text-align:center;">
                <div class="timer-digits" id="timerDigits">${mm}:${ss}</div>
                <div style="font-size:11px; letter-spacing:0.14em; color:var(--text-secondary); margin-top:4px;">${timerRunning ? 'INHALE · EXHALE' : 'READY FOR FLOW'}</div>
              </div>
            </div>
            <div style="display:flex; gap:10px; width:100%;">
              <button class="primary-btn" onclick="toggleTimer()">${timerRunning ? (state.lang === 'ko' ? '일시정지' : 'Pause') : (state.lang === 'ko' ? '몰입 시작 · 방해 금지' : 'Enter Deep Focus')}</button>
              <button class="pill-btn" style="padding:0 18px;" onclick="resetTimer()">↺</button>
            </div>
          </div>`;
      } else {
        bodyHtml = `
          <div style="padding:18px 20px; border-radius:22px; background:var(--bg-elevated); border:1px solid var(--border);">
            <div class="eyebrow">88-DAY IDENTITY HEATMAP</div>
            <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:12px 0 6px;">
              <div style="padding:12px; border-radius:14px; background:var(--bg-card); border:1px solid var(--border);">
                <div style="font-size:10px; color:var(--text-muted);">STREAK</div>
                <div style="font-family:var(--font-mono); font-size:22px; color:var(--gold); font-weight:700;">${state.streak}d</div>
              </div>
              <div style="padding:12px; border-radius:14px; background:var(--bg-card); border:1px solid var(--border);">
                <div style="font-size:10px; color:var(--text-muted);">FOCUS</div>
                <div style="font-family:var(--font-mono); font-size:22px; font-weight:700;">${state.focusMinutesTotal}m</div>
              </div>
              <div style="padding:12px; border-radius:14px; background:var(--bg-card); border:1px solid var(--border);">
                <div style="font-size:10px; color:var(--text-muted);">TARGET</div>
                <div style="font-family:var(--font-mono); font-size:22px; color:var(--sage); font-weight:700;">88d</div>
              </div>
            </div>
            <div class="heatmap-grid">
              ${state.heatmap.map((v, i) => `<div class="hm-dot ${v === 1 ? 'l1' : v === 2 ? 'l2' : v === 3 ? 'l3' : ''}" title="Day ${i+1}"></div>`).join('')}
            </div>
            <button class="pill-btn" style="margin-top:16px;" onclick="restartOnboarding()">↺ ${state.lang === 'ko' ? '온보딩 & 페이월 다시 체험하기' : 'Replay Onboarding & Paywall'}</button>
          </div>`;
      }

      stage.innerHTML = `
        <div class="os-tabs">
          ${L.tabs.map((lbl, idx) => `<button class="os-tab ${state.activeTab === idx ? 'active' : ''}" onclick="setTab(${idx})">${lbl}</button>`).join('')}
        </div>
        ${bodyHtml}`;
    }

    function selectGoal(id) { state.goal = id; save(); render(); }
    function toggleFriction(id) {
      if (state.frictions.includes(id)) state.frictions = state.frictions.filter(x => x !== id);
      else if (state.frictions.length < 2) state.frictions.push(id);
      else { state.frictions.shift(); state.frictions.push(id); }
      save(); render();
    }
    function updateWake(val) {
      state.wakeMinutes = Number(val);
      const sky = skyStyle(state.wakeMinutes);
      document.getElementById('skyTime').textContent = formatWake(state.wakeMinutes);
      document.getElementById('skyLabel').textContent = sky.lbl;
      document.getElementById('skyCard').style.background = sky.bg;
      save();
    }
    function selectIntensity(id) { state.intensity = id; save(); render(); }
    function toggleTrial() { state.trialOn = !state.trialOn; save(); render(); }
    function selectPlan(p) { state.plan = p; save(); render(); }

    function handleNext() {
      if (state.step < 6) {
        state.step += 1;
        save(); render();
      } else {
        document.getElementById('chkTodayAmt').textContent = state.trialOn
          ? (state.lang === 'ko' ? '₩0 (3일 무료)' : '$0.00 (3-day trial)')
          : (state.plan === 'annual' ? (state.lang === 'ko' ? '₩39,000 / 년' : '$44.99 / yr') : (state.lang === 'ko' ? '₩9,900 / 월' : '$11.99 / mo'));
        document.getElementById('checkoutModal').classList.add('open');
      }
    }
    function closeCheckout() { document.getElementById('checkoutModal').classList.remove('open'); }
    function completeCheckout() { closeCheckout(); enterOS(true); }
    function enterOS(isPro) {
      state.subscribed = isPro;
      state.step = 7;
      buildPersonalizedRituals();
      render();
    }
    function setTab(i) { state.activeTab = i; save(); render(); }
    function toggleRitual(id) {
      const r = state.rituals.find(x => x.id === id);
      if (r) {
        r.done = !r.done;
        const doneRatio = state.rituals.filter(x => x.done).length / state.rituals.length;
        state.heatmap[state.streak] = doneRatio >= 0.75 ? 3 : doneRatio > 0 ? 2 : 0;
        save(); render();
      }
    }
    function addRitual() {
      const inp = document.getElementById('newRitualInput');
      if (inp && inp.value.trim()) {
        state.rituals.push({ id: Date.now(), title: inp.value.trim(), tag: 'CUSTOM', done: false });
        save(); render();
      }
    }
    function toggleTimer() {
      if (timerRunning) {
        clearInterval(timerInterval); timerRunning = false; render();
      } else {
        timerRunning = true; render();
        timerInterval = setInterval(() => {
          if (timerSec > 0) {
            timerSec -= 1;
            const el = document.getElementById('timerDigits');
            if (el) el.textContent = `${String(Math.floor(timerSec/60)).padStart(2,'0')}:${String(timerSec%60).padStart(2,'0')}`;
          } else {
            clearInterval(timerInterval); timerRunning = false;
            state.focusMinutesTotal += 45;
            if (state.rituals[1]) state.rituals[1].done = true;
            save(); render();
          }
        }, 1000);
      }
    }
    function resetTimer() {
      clearInterval(timerInterval); timerRunning = false;
      timerSec = (state.intensity === 'gentle' ? 15 : state.intensity === 'monk' ? 90 : 45) * 60;
      render();
    }
    function restartOnboarding() { state.step = 1; save(); render(); }

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
    render();
  </script>
</body>
</html>
