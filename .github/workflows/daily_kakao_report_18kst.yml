name: Daily 18:00 KST KakaoTalk Executive Report (24/365 PC-OFF)

on:
  schedule:
    # 매일 오후 6시 00분 KST (UTC 09:00) 카카오톡 '나에게 보내기' 자동 발송
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: daily-kakao-report
  cancel-in-progress: false

jobs:
  send-kakao-daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send Daily 18:00 KST Summary via KakaoTalk '나에게 보내기'
        working-directory: autopilot/shortform-agency-autopilot
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: python -m agency_engine.kakao_notifier
