name: Periodic External-Expert Self-Evolution & Upgrade (Mon/Thu KST 08:30)

on:
  schedule:
    # 매일 2회 (KST 08:30, 20:30 / UTC 23:30, 11:30) 고빈도 자율학습·정책 진화·업그레이드
    - cron: "30 11,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-expert-evolution
  cancel-in-progress: false

jobs:
  evolve-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install pillow imageio-ffmpeg edge-tts

      - name: Run 3-Expert Periodic Audit & Bounded Autonomous Policy Upgrade
        working-directory: autopilot/shortform-agency-autopilot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m agency_engine evolve

      - name: Verification Gate (Auto-Reject Upgrade if Any Test Fails)
        working-directory: autopilot/shortform-agency-autopilot
        run: python -m unittest tests.test_agency_autopilot.TestHooksLibrary tests.test_agency_autopilot.TestScriptPlanner tests.test_agency_autopilot.TestAgencyEconomics tests.test_agency_autopilot.TestEndToEndAgencyPipeline.test_autonomous_evolution_cycle_stays_within_safe_bounds -v

      - name: Commit Evolved Policy & Learning Ledger to Main
        run: |
          git config user.name "autopilot-evolution-bot"
          git config user.email "autopilot-evolution-bot@users.noreply.github.com"
          git add autopilot/shortform-agency-autopilot/data/learned_policy.json autopilot/shortform-agency-autopilot/data/evolution_history.json
          git diff --cached --quiet || git commit -m "chore(evolution): autonomous expert policy self-upgrade [skip ci]"
          git push origin HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: expert-evolution-report
          path: autopilot/shortform-agency-autopilot/output/evolution/
          retention-days: 30
